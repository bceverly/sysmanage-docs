<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396" role="img" aria-labelledby="coverWideTitle coverWideDesc"
     font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="coverWideTitle">SysManage — one control plane for your entire infrastructure</title>
  <desc id="coverWideDesc">Every operating system converges on a single SysManage control plane: Windows, Linux, macOS, FreeBSD, OpenBSD, and NetBSD.</desc>
  <defs>
    <linearGradient id="cwBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#0b3450"/>
      <stop offset="0.55" stop-color="#0d3d5c"/>
      <stop offset="1"    stop-color="#123f43"/>
    </linearGradient>
    <radialGradient id="cwGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1565a0" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#1565a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cwNode" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#8fd0f2" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#4a9fd8" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#4a9fd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cwScrim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#0d3d5c" stop-opacity="0.88"/>
      <stop offset="0.60" stop-color="#0d3d5c" stop-opacity="0.72"/>
      <stop offset="1"    stop-color="#0d3d5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cwRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#1565a0"/>
      <stop offset="0.5" stop-color="#4a9fd8"/>
      <stop offset="1"   stop-color="#5fa865"/>
    </linearGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#cwBg)"/>
  <ellipse cx="792" cy="170" rx="760" ry="310" fill="url(#cwGlow)"/>

  <!-- A fragmented fleet converging on one control plane -->
  <g fill="none" stroke-width="1.9">
    <g stroke="#4a9fd8" stroke-opacity="0.46">
      <path d="M-40,10  C 320,10  500,391 792,391"/>
      <path d="M-40,72  C 350,72  530,391 792,391"/>
      <path d="M-40,134 C 380,134 560,391 792,391"/>
      <path d="M-40,196 C 410,196 590,391 792,391"/>
      <path d="M-40,258 C 440,258 620,391 792,391"/>
      <path d="M-40,320 C 470,320 650,391 792,391"/>
    </g>
    <g stroke="#5fa865" stroke-opacity="0.46">
      <path d="M1624,10  C 1264,10  1084,391 792,391"/>
      <path d="M1624,72  C 1234,72  1054,391 792,391"/>
      <path d="M1624,134 C 1204,134 1024,391 792,391"/>
      <path d="M1624,196 C 1174,196 994,391  792,391"/>
      <path d="M1624,258 C 1144,258 964,391  792,391"/>
      <path d="M1624,320 C 1114,320 934,391  792,391"/>
    </g>
  </g>

  <!-- Scrim keeps the centred message legible over the line field -->
  <ellipse cx="792" cy="196" rx="640" ry="150" fill="url(#cwScrim)"/>

  <text x="792" y="142" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="8" fill="#7fb6dd">SYSMANAGE</text>

  <text x="792" y="212" text-anchor="middle" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-0.4">One control plane for your entire infrastructure</text>

  <text x="792" y="260" text-anchor="middle" font-size="21" font-weight="600" letter-spacing="2.8" fill="#a9d5f0">
    Windows<tspan fill="#5b7f99"> · </tspan>Linux<tspan fill="#5b7f99"> · </tspan>macOS<tspan fill="#5b7f99"> · </tspan><tspan fill="#9fd6ae">FreeBSD</tspan><tspan fill="#5b7f99"> · </tspan><tspan fill="#9fd6ae">OpenBSD</tspan><tspan fill="#5b7f99"> · </tspan><tspan fill="#9fd6ae">NetBSD</tspan>
  </text>

  <!-- The control plane: where everything lands -->
  <circle cx="792" cy="391" r="48" fill="url(#cwNode)"/>
  <rect x="0" y="391" width="1584" height="5" fill="url(#cwRule)"/>
  <circle cx="792" cy="391" r="7" fill="#ffffff"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4200 700" width="4200" height="700" role="img" aria-labelledby="coverTitle coverDesc"
     font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="coverTitle">SysManage — one control plane for your entire infrastructure</title>
  <desc id="coverDesc">Every operating system converges on a single SysManage control plane: Windows, Linux, macOS, FreeBSD, OpenBSD, and NetBSD.</desc>
  <defs>
    <linearGradient id="cvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#0b3450"/>
      <stop offset="0.55" stop-color="#0d3d5c"/>
      <stop offset="1"    stop-color="#123f43"/>
    </linearGradient>
    <radialGradient id="cvGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1565a0" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#1565a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cvNode" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#8fd0f2" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#4a9fd8" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#4a9fd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cvScrim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#0d3d5c" stop-opacity="0.88"/>
      <stop offset="0.60" stop-color="#0d3d5c" stop-opacity="0.72"/>
      <stop offset="1"    stop-color="#0d3d5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cvRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#1565a0"/>
      <stop offset="0.5" stop-color="#4a9fd8"/>
      <stop offset="1"   stop-color="#5fa865"/>
    </linearGradient>
  </defs>

  <rect width="4200" height="700" fill="url(#cvBg)"/>
  <ellipse cx="2100" cy="293" rx="2010" ry="550" fill="url(#cvGlow)"/>

  <!-- A fragmented fleet converging on one control plane -->
  <g fill="none" stroke-width="6">
    <g stroke="#4a9fd8" stroke-opacity="0.46">
      <path d="M-112,22  C 856,22   1340,682 2100,682"/>
      <path d="M-112,169 C 931,169  1415,682 2100,682"/>
      <path d="M-112,315 C 1005,315 1489,682 2100,682"/>
      <path d="M-112,462 C 1080,462 1564,682 2100,682"/>
      <path d="M-112,608 C 1154,608 1638,682 2100,682"/>
    </g>
    <g stroke="#5fa865" stroke-opacity="0.46">
      <path d="M4312,22  C 3344,22   2860,682 2100,682"/>
      <path d="M4312,169 C 3269,169  2785,682 2100,682"/>
      <path d="M4312,315 C 3195,315  2711,682 2100,682"/>
      <path d="M4312,462 C 3120,462  2636,682 2100,682"/>
      <path d="M4312,608 C 3046,608  2562,682 2100,682"/>
    </g>
  </g>

  <!-- Scrim keeps the centred message legible over the line field -->
  <ellipse cx="2100" cy="337" rx="1675" ry="320" fill="url(#cvScrim)"/>

  <text x="2100" y="305" text-anchor="middle" font-size="112" font-weight="700" fill="#ffffff" letter-spacing="-1">One control plane for your entire infrastructure</text>

  <text x="2100" y="448" text-anchor="middle" font-size="56" font-weight="600" letter-spacing="7.2" fill="#a9d5f0">
    Windows<tspan fill="#5b7f99"> · </tspan>Linux<tspan fill="#5b7f99"> · </tspan>macOS<tspan fill="#5b7f99"> · </tspan><tspan fill="#9fd6ae">FreeBSD</tspan><tspan fill="#5b7f99"> · </tspan><tspan fill="#9fd6ae">OpenBSD</tspan><tspan fill="#5b7f99"> · </tspan><tspan fill="#9fd6ae">NetBSD</tspan>
  </text>

  <!-- The control plane: where everything lands -->
  <circle cx="2100" cy="682" r="127" fill="url(#cvNode)"/>
  <rect x="0" y="682" width="4200" height="18" fill="url(#cvRule)"/>
  <circle cx="2100" cy="682" r="20" fill="#ffffff"/>
</svg>

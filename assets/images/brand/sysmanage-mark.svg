<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="markTitle markDesc">
  <title id="markTitle">SysManage</title>
  <desc id="markDesc">The SysManage brand mark: six managed operating systems connected to one central control plane.</desc>
  <defs>
    <linearGradient id="markBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10496f"/>
      <stop offset="1" stop-color="#0b3450"/>
    </linearGradient>
    <radialGradient id="markGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4a9fd8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4a9fd8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#markBg)"/>
  <circle cx="256" cy="256" r="196" fill="url(#markGlow)"/>
  <!-- Rim keeps the tile's silhouette from dissolving into dark-mode surfaces -->
  <rect x="2.5" y="2.5" width="507" height="507" rx="109.5" fill="none" stroke="#3d86b5" stroke-opacity="0.5" stroke-width="5"/>

  <!-- Spokes: hub to each managed system -->
  <g stroke="#ffffff" stroke-opacity="0.42" stroke-width="11" stroke-linecap="round">
    <line x1="256"    y1="216" x2="256"    y2="106"/>
    <line x1="290.64" y1="236" x2="385.90" y2="181"/>
    <line x1="221.36" y1="236" x2="126.10" y2="181"/>
    <line x1="290.64" y1="276" x2="385.90" y2="331"/>
    <line x1="256"    y1="296" x2="256"    y2="406"/>
    <line x1="221.36" y1="276" x2="126.10" y2="331"/>
  </g>

  <!-- Managed systems: blue = Windows, Linux, macOS -->
  <g fill="#4a9fd8">
    <circle cx="256"    cy="106" r="30"/>
    <circle cx="385.90" cy="181" r="30"/>
    <circle cx="126.10" cy="181" r="30"/>
  </g>
  <!-- Managed systems: green = FreeBSD, OpenBSD, NetBSD -->
  <g fill="#5fa865">
    <circle cx="385.90" cy="331" r="30"/>
    <circle cx="256"    cy="406" r="30"/>
    <circle cx="126.10" cy="331" r="30"/>
  </g>

  <!-- Control plane hub -->
  <circle cx="256" cy="256" r="62" fill="#4a9fd8"/>
  <circle cx="256" cy="256" r="27" fill="#ffffff"/>
</svg>

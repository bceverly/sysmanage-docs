<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627" role="img" aria-labelledby="cardTitle cardDesc"
     font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="cardTitle">SysManage — one control plane for your entire infrastructure</title>
  <desc id="cardDesc">SysManage manages Windows, Linux, macOS, FreeBSD, OpenBSD, and NetBSD from one control plane covering inventory, patching, vulnerabilities, compliance, automation, and reporting.</desc>
  <defs>
    <linearGradient id="scBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#0b3450"/>
      <stop offset="0.55" stop-color="#0d3d5c"/>
      <stop offset="1"    stop-color="#123f43"/>
    </linearGradient>
    <radialGradient id="scGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1565a0" stop-opacity="0.60"/>
      <stop offset="1" stop-color="#1565a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="scNode" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#8fd0f2" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#4a9fd8" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#4a9fd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="scScrim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#0d3d5c" stop-opacity="0.88"/>
      <stop offset="0.60" stop-color="#0d3d5c" stop-opacity="0.72"/>
      <stop offset="1"    stop-color="#0d3d5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#1565a0"/>
      <stop offset="0.5" stop-color="#4a9fd8"/>
      <stop offset="1"   stop-color="#5fa865"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="627" fill="url(#scBg)"/>
  <ellipse cx="600" cy="250" rx="600" ry="440" fill="url(#scGlow)"/>

  <!-- A fragmented fleet converging on one control plane -->
  <g fill="none" stroke-width="1.8">
    <g stroke="#4a9fd8" stroke-opacity="0.42">
      <path d="M-40,20  C 240,20  380,622 600,622"/>
      <path d="M-40,120 C 270,120 410,622 600,622"/>
      <path d="M-40,220 C 300,220 440,622 600,622"/>
      <path d="M-40,320 C 330,320 470,622 600,622"/>
      <path d="M-40,420 C 360,420 500,622 600,622"/>
      <path d="M-40,520 C 390,520 530,622 600,622"/>
    </g>
    <g stroke="#5fa865" stroke-opacity="0.42">
      <path d="M1240,20  C 960,20  820,622 600,622"/>
      <path d="M1240,120 C 930,120 790,622 600,622"/>
      <path d="M1240,220 C 900,220 760,622 600,622"/>
      <path d="M1240,320 C 870,320 730,622 600,622"/>
      <path d="M1240,420 C 840,420 700,622 600,622"/>
      <path d="M1240,520 C 810,520 670,622 600,622"/>
    </g>
  </g>

  <ellipse cx="600" cy="300" rx="560" ry="250" fill="url(#scScrim)"/>

  <!-- Brand mark -->
  <g transform="translate(552, 60) scale(0.1875)">
    <g stroke="#ffffff" stroke-opacity="0.42" stroke-width="11" stroke-linecap="round">
      <line x1="256"    y1="216" x2="256"    y2="106"/>
      <line x1="290.64" y1="236" x2="385.90" y2="181"/>
      <line x1="221.36" y1="236" x2="126.10" y2="181"/>
      <line x1="290.64" y1="276" x2="385.90" y2="331"/>
      <line x1="256"    y1="296" x2="256"    y2="406"/>
      <line x1="221.36" y1="276" x2="126.10" y2="331"/>
    </g>
    <g fill="#4a9fd8">
      <circle cx="256"    cy="106" r="30"/>
      <circle cx="385.90" cy="181" r="30"/>
      <circle cx="126.10" cy="181" r="30"/>
    </g>
    <g fill="#5fa865">
      <circle cx="385.90" cy="331" r="30"/>
      <circle cx="256"    cy="406" r="30"/>
      <circle cx="126.10" cy="331" r="30"/>
    </g>
    <circle cx="256" cy="256" r="62" fill="#4a9fd8"/>
    <circle cx="256" cy="256" r="27" fill="#ffffff"/>
  </g>

  <text x="600" y="207" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="0.5">SysManage</text>

  <text x="600" y="311" text-anchor="middle" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-0.4">One control plane for your entire infrastructure</text>

  <text x="600" y="366" text-anchor="middle" font-size="20" font-weight="600" letter-spacing="2.6" fill="#a9d5f0">
    Windows<tspan fill="#5b7f99"> · </tspan>Linux<tspan fill="#5b7f99"> · </tspan>macOS<tspan fill="#5b7f99"> · </tspan><tspan fill="#9fd6ae">FreeBSD</tspan><tspan fill="#5b7f99"> · </tspan><tspan fill="#9fd6ae">OpenBSD</tspan><tspan fill="#5b7f99"> · </tspan><tspan fill="#9fd6ae">NetBSD</tspan>
  </text>

  <line x1="440" y1="410" x2="760" y2="410" stroke="#4a9fd8" stroke-opacity="0.35" stroke-width="1.5"/>

  <text x="600" y="452" text-anchor="middle" font-size="16.5" font-weight="600" letter-spacing="2.4" fill="#7fa8c4">Inventory · Patching · Vulnerabilities · Compliance · Automation · Reporting</text>

  <text x="600" y="546" text-anchor="middle" font-size="19" font-weight="600" letter-spacing="3.4" fill="#7fb6dd">sysmanage.org</text>

  <!-- The control plane: where everything lands -->
  <circle cx="600" cy="622" r="44" fill="url(#scNode)"/>
  <rect x="0" y="621" width="1200" height="6" fill="url(#scRule)"/>
  <circle cx="600" cy="622" r="6.5" fill="#ffffff"/>
</svg>

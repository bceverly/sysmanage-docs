<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="markLightTitle markLightDesc">
  <title id="markLightTitle">SysManage</title>
  <desc id="markLightDesc">The SysManage brand mark on a transparent background: six managed operating systems connected to one central control plane.</desc>

  <!-- Spokes: hub to each managed system -->
  <g stroke="#6c7a89" stroke-opacity="0.55" stroke-width="11" stroke-linecap="round">
    <line x1="256"    y1="216" x2="256"    y2="106"/>
    <line x1="290.64" y1="236" x2="385.90" y2="181"/>
    <line x1="221.36" y1="236" x2="126.10" y2="181"/>
    <line x1="290.64" y1="276" x2="385.90" y2="331"/>
    <line x1="256"    y1="296" x2="256"    y2="406"/>
    <line x1="221.36" y1="276" x2="126.10" y2="331"/>
  </g>

  <!-- Managed systems: blue = Windows, Linux, macOS -->
  <g fill="#1976d2">
    <circle cx="256"    cy="106" r="30"/>
    <circle cx="385.90" cy="181" r="30"/>
    <circle cx="126.10" cy="181" r="30"/>
  </g>
  <!-- Managed systems: green = FreeBSD, OpenBSD, NetBSD -->
  <g fill="#388e3c">
    <circle cx="385.90" cy="331" r="30"/>
    <circle cx="256"    cy="406" r="30"/>
    <circle cx="126.10" cy="331" r="30"/>
  </g>

  <!-- Control plane hub -->
  <circle cx="256" cy="256" r="62" fill="#1565a0"/>
  <circle cx="256" cy="256" r="27" fill="#ffffff"/>
</svg>

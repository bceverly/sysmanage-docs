#
# What SysManage can do, in which edition, since when, and on which
# operating systems.  ONE source for the editions page, the supported
# platforms page and the pricing page: `make matrix` writes their tables,
# `make matrix-check` fails when a page no longer matches this file.
#
# Every row was checked against the code on 2026-11-05:
#   edition  -> sysmanage/backend/licensing/features.py (TIER_MODULES /
#               TIER_FEATURES); a feature with no license check is Community
#   status   -> sysmanage/ROADMAP.md (ticked phases = available)
#   os       -> sysmanage-agent/src/sysmanage_agent/** (what the agent does
#               on each platform) and the Pro+ engine sources
# Review it at every release: a row that changes in the code changes here.
#
# edition: community | professional | enterprise | saas
# status:  available (since: first release) | preview (in the current
#          release, final proof still open) | planned (phase, target)
# os: per platform yes | partial | no, with a note for partial; omit `os`
#     for a server-side capability that works the same for every host.

editions:
  - id: community
    name: Community
  - id: professional
    name: Professional

# Where the server and the agent install: one row per operating system.
# Written to the `releases` table.  Checked 2026-11-05 against the install
# pages (docs/server/installation.html, docs/agent/installation.html) and
# the packaging: debian/control, APKBUILD, PKGBUILD, the FreeBSD manifest
# (FreeBSD:*:amd64), NetBSD +BUILD_INFO (x86_64).  `ci` is the release the
# automated tests run on (sysmanage/.github/workflows, bsd-tests.yml); "-"
# means packages are built for it but no CI job runs there.
releases:
  - id: ubuntu
    os: Ubuntu
    releases: 22.04 LTS, 24.04 LTS, 26.04 LTS
    arch: amd64, arm64, riscv64
    server: Launchpad PPA, Snap Store
    agent: Launchpad PPA
    ci: 24.04 LTS
  - id: debian
    os: Debian
    releases: 12 and newer
    arch: amd64, arm64
    server: SysManage APT repository
    agent: SysManage APT repository
    ci: "-"
  - id: rhel
    os: RHEL, Rocky Linux, AlmaLinux, Oracle Linux, CentOS Stream
    releases: 9 and 10
    arch: x86_64, aarch64
    server: Fedora Copr
    agent: Fedora Copr; DNF repository on the mirror (9)
    ci: "-"
  - id: fedora
    os: Fedora, Amazon Linux
    releases: Fedora 43, Amazon Linux 2023
    arch: x86_64, aarch64
    server: Not packaged
    agent: Fedora Copr
    ci: "-"
  - id: opensuse
    os: openSUSE
    releases: Tumbleweed
    arch: x86_64
    server: openSUSE Build Service
    agent: RPM repository on the mirror
    ci: "-"
  - id: sles
    os: SUSE Linux Enterprise Server
    releases: "15"
    arch: x86_64
    server: openSUSE Build Service, where the project builds it
    agent: RPM repository on the mirror
    ci: "-"
  - id: arch
    os: Arch Linux
    releases: Rolling
    arch: Any
    server: AUR
    agent: AUR
    ci: "-"
  - id: alpine
    os: Alpine Linux
    releases: 3.21, 3.22
    arch: Any
    server: Direct download (checksum)
    agent: Direct download (checksum)
    ci: "-"
  - id: macos
    os: macOS
    releases: Current releases
    arch: Apple silicon, Intel
    server: Homebrew; direct download (checksum)
    agent: Homebrew; direct download (checksum)
    ci: macOS 15
  - id: windows
    os: Windows
    releases: Current releases
    arch: x64, ARM64
    server: winget; MSI download (checksum)
    agent: winget; installer download (checksum)
    ci: Windows Server 2025
  - id: freebsd
    os: FreeBSD
    releases: "14"
    arch: amd64
    server: Direct download (checksum)
    agent: Direct download (checksum)
    ci: "14.3"
  - id: openbsd
    os: OpenBSD
    releases: 7.9, 8.0
    arch: amd64
    server: Direct download (checksum)
    agent: Direct download (checksum)
    ci: "7.9"
  - id: netbsd
    os: NetBSD
    releases: "10"
    arch: x86_64
    server: Direct download (checksum)
    agent: Direct download (checksum)
    ci: "10.1"

[files]
extend-exclude = [
    # i18n allow-list: REGEXES plus product names and deliberate foreign-language
    # cognates — not prose, and not spell-checkable.  typos reads pattern
    # fragments as words and flags them: "(Ba|K|Z|Tc|C|Fi)sh" (the bash/ksh/zsh/
    # tcsh/csh/fish alternation) becomes "Ba", "Open[- ]?[Ss]ource" becomes
    # "ource", and the de:-scoped rule legitimately contains German ("Modul",
    # "Funktion").  Renamed from assets/locales/no-translate.txt on 2026-08-05
    # when the two allow-lists were merged into one file at the repo root; the
    # exclusion did not follow the rename, which is what broke `make test`.
    "i18n-allow.txt",
    "*.png", "*.jpg", "*.jpeg", "*.gif", "*.svg",
    "*.js", "*.min.js", "*.min.css",
    "node_modules/**/*",
    ".git/**/*",
    "*.lock", "*.log",
    "package-lock.json",
    "*.woff", "*.woff2", "*.ttf", "*.eot",
    "*.map",
    # Exclude GPG keys (contain base64 encoded data)
    "*.asc", "*.gpg", "*.pgp",
    "gpg-public-key.asc",
    # Exclude foreign language translation files
    "assets/locales/**/*",
    "frontend/public/locales/**/*",
    "backend/i18n/**/*",
    # Exclude any JSON files with translations
    "**/locales/**/*.json",
    "**/i18n/**/*.json",
    # Exclude scripts that contain translation data
    "scripts/add_proplus_translations.py",
    # Exclude auto-generated SBOM files (contain third-party package names/descriptions)
    "repo/**/sbom/**/*",
    # Exclude typos project documentation (not part of SysManage)
    "doc/**/*",
    # Exclude typos binary
    "typos"
]

[default.extend-words]
# "OT" = operational technology (utilities/industrial), not a typo of TO/OF/etc.
OT = "OT"

name: MITRE Lucky 13
# MITRE "Lucky 13" unforgivable vulnerabilities (Steve Christey, Black Hat
# 2007): https://cwe.mitre.org/documents/unforgivable_vulns/unforgivable.pdf
# This repository's share of the checks every SysManage repository runs on
# every push; locally: make test-lucky13.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lucky13:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: MITRE "Lucky 13" unforgivable vulnerabilities (Christey 2007)
        run: python3 scripts/lucky13_check.py

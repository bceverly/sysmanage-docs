#
# ONE-TIME: sign packages published before repo signing existed.
#
# Manual only.  This mutates published packages, so it must never be on a
# schedule or a dispatch: it is a single catch-up pass, after which the release
# workflows sign at build time and this becomes a no-op.
#
# It deliberately syncs back WITHOUT --size-only.  Re-signing changes a
# package's bytes but usually not its size, so a size-only comparison would skip
# the upload and leave R2 serving pre-signature bytes under post-signature
# checksums -- "package does not match intended download" for every consumer.
name: Sign existing packages (one-time)

on:
  workflow_dispatch:

concurrency:
  group: prune-r2 # shares the prune lock: never mutate the repo concurrently
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c rpm

      - name: Import archive signing subkey
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${APT_SIGNING_KEY:-}" ]; then
            echo "::error::APT_SIGNING_KEY is not set"
            exit 1
          fi
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          gpgconf --kill gpg-agent || true
          gpg --batch --list-secret-keys >/dev/null 2>&1 || {
            echo "::error::secret key not present after import"
            exit 1
          }
          if [ -n "${APT_SIGNING_PASSPHRASE:-}" ]; then
            printf '%s' "$APT_SIGNING_PASSPHRASE" > "$GNUPGHOME/pp"
            chmod 600 "$GNUPGHOME/pp"
            echo "APT_GPG_EXTRA=--pinentry-mode loopback --passphrase-file $GNUPGHOME/pp" >> "$GITHUB_ENV"
          fi

      - name: Pull, sign, reindex, publish
        env:
          APT_SIGNING_KEY_ID: ${{ secrets.APT_SIGNING_KEY_ID }}
          APT_SIGN_REQUIRED: "1"
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # R2 rejected a multipart upload from the aws-cli on Ubuntu 26.04 runners
          # (InvalidPart, agent 3.12.0.21, 2026-10-31): newer aws-cli can pick the CRT
          # transfer client, whose parts R2 does not accept.  The classic client, and
          # single-part uploads for anything under 512 MB (every package we publish),
          # avoid it.
          aws configure set default.s3.preferred_transfer_client classic
          aws configure set default.s3.multipart_threshold 512MB
          # The classic client moves 10 files at a time by default; the flatpak
          # OSTree store alone is thousands of small objects.
          aws configure set default.s3.max_concurrent_requests 64
          aws s3 sync "s3://${R2_BUCKET}/" repo/ \
            --endpoint-url "$ENDPOINT" --region auto --only-show-errors

          # Same guard the prune job uses: a bad/empty pull must never become a
          # destructive push.
          test "$(find repo -type f 2>/dev/null | wc -l)" -gt 50 || {
            echo "::error::R2 pull returned <50 files - refusing to publish"
            exit 1
          }

          ./scripts/sign-existing-packages.sh

          # NO --size-only: signing changes content, not necessarily size.
          aws s3 sync repo/ "s3://${R2_BUCKET}/" \
            --endpoint-url "$ENDPOINT" --region auto --only-show-errors

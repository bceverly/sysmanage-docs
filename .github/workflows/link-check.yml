name: Link Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Mondays

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check links
        uses: lycheeverse/lychee-action@a8c4c7cb88f0c7386610c35eb25108e448569cb0 # v2
        with:
          # Retries 10 s apart: a vendor site's momentary refusal (docs.chef.io,
          # 2026-11-23: "Connection failed", 200 again minutes later) is not a
          # broken link.  lychee's default is 3 retries 1 s apart.
          args: --max-retries 5 --retry-wait-time 10 --verbose --no-progress --exclude-path node_modules --exclude-path .git --exclude-path SignPath --exclude 'http://localhost:*' '**/*.md' '**/*.html'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
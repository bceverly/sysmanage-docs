name: Prune package repo on R2

# Keeps only the latest 5 versions of each package on Cloudflare R2 — all
# platforms, server + agent — by running `make prune-repo` (pull repo/ from R2,
# keep newest 5 of each version-dir + regenerate apt/rpm/alpine indexes, then
# mirror back with --delete; guarded against an empty pull wiping the bucket).
#
# Triggers:
#   * repository_dispatch (prune-r2) — fired by the sysmanage / sysmanage-agent
#     release pipelines right after they publish, so retention runs per release.
#   * schedule — weekly backstop in case a dispatch is ever missed.
#   * workflow_dispatch — run it by hand anytime.

on:
  repository_dispatch:
    types: [prune-r2]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1" # Mondays 08:17 UTC

# One prune at a time (server + agent releases can both fire the dispatch);
# don't cancel an in-flight prune mid --delete.
concurrency:
  group: prune-r2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install index-regen tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c
          # apk (alpine index) is best-effort — the prune script warns and skips
          # alpine index regen if it's absent rather than failing the run.
          sudo apt-get install -y apk-tools || \
            echo "::warning::apk-tools unavailable; alpine APKINDEX regen will be skipped"

      - name: Import archive signing subkey
        # THIS JOB RUNS LAST and mirrors back with --delete, so whatever it
        # generates is what the world sees.  Without the key it regenerates the
        # apt metadata UNSIGNED and deletes the InRelease/Release.gpg the
        # release had just published -- un-signing the repo minutes after
        # publication, and again every Monday on the cron even when nothing
        # shipped.  A signed repo that silently reverts is worse than one that
        # was never signed: consumers using signed-by break with no release to
        # blame.
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${APT_SIGNING_KEY:-}" ]; then
            echo "::error::APT_SIGNING_KEY is not set - refusing to republish the repo unsigned"
            exit 1
          fi
          # EXPORT it before importing.  Writing to $GITHUB_ENV only affects
          # LATER steps, so the import previously landed in the default
          # ~/.gnupg while the signing step looked in this empty temp dir --
          # "gpg: skipped: No secret key", on 2026-08-16.
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          # Prove the secret key is actually usable from THIS home before the
          # next step relies on it.
          gpg --batch --list-secret-keys >/dev/null 2>&1 || {
            echo "::error::secret key not present in $GNUPGHOME after import"
            exit 1
          }
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          gpgconf --kill gpg-agent || true
          if [ -n "${APT_SIGNING_PASSPHRASE:-}" ]; then
            printf '%s' "$APT_SIGNING_PASSPHRASE" > "$GNUPGHOME/pp"
            chmod 600 "$GNUPGHOME/pp"
            echo "APT_GPG_EXTRA=--pinentry-mode loopback --passphrase-file $GNUPGHOME/pp" >> "$GITHUB_ENV"
          fi

      - name: Prune R2 to the latest 5 versions
        run: make prune-repo
        env:
          APT_SIGNING_KEY_ID: ${{ secrets.APT_SIGNING_KEY_ID }}
          APT_SIGN_REQUIRED: "1"
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Work around aws-cli v2.23+ default integrity checksums R2 rejects.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
